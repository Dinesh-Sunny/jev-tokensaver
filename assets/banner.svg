    <rect x="70" y="178" width="140" height="8" rx="4"/><rect x="70" y="196" width="190" height="8" rx="4"/>
    <rect x="70" y="214" width="160" height="8" rx="4"/><rect x="70" y="232" width="210" height="8" rx="4"/>
  </g>
  <rect x="70" y="142" width="180" height="8" rx="4" fill="#f87171"/>
