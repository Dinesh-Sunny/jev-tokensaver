    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <!-- many lines in -->
  <g opacity="0.55" fill="#94a3b8">
    <rect x="70" y="70" width="190" height="8" rx="4"/><rect x="70" y="88" width="150" height="8" rx="4"/>
    <rect x="70" y="106" width="210" height="8" rx="4"/><rect x="70" y="124" width="120" height="8" rx="4"/>
