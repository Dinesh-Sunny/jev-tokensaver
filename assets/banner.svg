<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">jev-tokensaver</title>
  <desc id="d">Many lines of text are filtered down to the few that matter before they reach Claude.</desc>
  <defs>
