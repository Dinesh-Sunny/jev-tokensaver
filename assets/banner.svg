  <path d="M392 156 L432 156" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <path d="M424 148 L434 156 L424 164" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
